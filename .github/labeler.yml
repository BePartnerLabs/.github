version: v1

labels:
  - label: "build"
    matcher:
      title: "^build[:(].*"
      branch: "build/.*"

  - label: "chore"
    matcher:
      title: "^chore[:(].*"
      branch: "chore/.*"

  - label: "ci"
    matcher:
      title: "^ci[:(].*"
      branch: "ci/.*"

  - label: "docs"
    matcher:
      title: "^docs[:(].*"
      branch: "docs/.*"

  - label: "feat"
    matcher:
      title: "^feat[:(].*"
      branch: "feat/.*"

  - label: "fix"
    matcher:
      title: "^fix[:(].*"
      branch: "fix/.*"

  - label: "perf"
    matcher:
      title: "^perf[:(].*"
      branch: "perf/.*"

  - label: "refactor"
    matcher:
      title: "^refactor[:(].*"
      branch: "refactor/.*"

  - label: "revert"
    matcher:
      title: "^revert[:(].*"
      branch: "revert/.*"

  - label: "style"
    matcher:
      title: "^style[:(].*"
      branch: "style/.*"

  - label: "test"
    matcher:
      title: "^test[:(].*"
      branch: "test/.*"

  - label: "minor"
    matcher:
      title: "^[a-z]+![(:].*"

  # Por archivos y no por titulo: un PR lleva migracion cuando toca la carpeta,
  # se llame como se llame. `**/migrations/**` cubre `src/migrations` (Payload)
  # y las de cualquier otro proyecto sin nombrarlos uno por uno. La etiqueta no
  # mueve la version —eso lo decide el tipo del PR—: avisa en las notas del
  # release que ese deploy toca la base y no se revierte promoviendo el
  # anterior.
  - label: "migration"
    matcher:
      files: "**/migrations/**"
