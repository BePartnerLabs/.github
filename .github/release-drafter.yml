name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
categories:
  # Va primera y aparte: es lo que hay que saber antes de publicar. Un PR con
  # esta etiqueta sale aca **y** en la categoria de su tipo —release-drafter
  # repite el PR en cada categoria que le corresponde—. Si la seccion no
  # aparece en el borrador, el release no lleva migracion.
  - title: '⚠️ Database migrations'
    labels:
      - 'migration'
  - title: 'Features'
    labels:
      - 'feature'
      - 'feat'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'revert'
  - title: 'Performance & Refactor'
    labels:
      - 'refactor'
      - 'style'
      - 'perf'
  - title: 'Maintenance'
    labels:
      - 'build'
      - 'chore'
      - 'ci'
  - title: 'Documentation & Tests'
    labels:
      - 'docs'
      - 'test'
  - title: 'Other'
version-resolver:
  major:
    labels:
      - 'major'
      # labeler.yml auto-applies "minor" to breaking-change commits/PRs
      # (title/branch matching `type!:` or `type!(scope):`, e.g. "feat!: ..."),
      # not to be confused with a semver minor bump — per semver, a breaking
      # change is a MAJOR bump.
      - 'minor'
  minor:
    labels:
      - 'feat'
  patch:
    labels:
      - 'patch'
  default: patch
